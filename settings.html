<header class="hd">

    <a class="logo" href="requests.html" aria-label="보안길잡이 AI 신청 현황으로">

        <svg class="gs-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <input id="gq" class="input" type="search" placeholder="신청·화면 검색" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="gq-list" aria-autocomplete="list" aria-describedby="gq-k">
        <kbd id="gq-k" aria-label="단축키 Ctrl K">Ctrl K</kbd>
        <ul class="glist" id="gq-list" role="listbox" aria-label="검색 결과" hidden></ul>
      </div>
      <div class="umenu-wrap">
        <button type="button" class="ubtn" id="btn-user" aria-expanded="false" aria-controls="umenu"><span class="uav" id="u-av" aria-hidden="true"></span><span class="utxt"><b id="u-name"></b><span id="u-dept"></span></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="umenu" id="umenu" hidden><p class="meta" style="margin:0 0 .8rem">사용자 전환</p><ul id="u-list"></ul></div>
      </div>
      <div class="noti-wrap">
        <button type="button" class="tbtn" id="btn-noti" aria-expanded="false" aria-controls="noti" aria-label="알림"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 003.4 0"/></svg><span class="ndot" id="noti-n" hidden></span></button>
        <section class="noti" id="noti" hidden aria-labelledby="noti-h">
          <div class="noti-h"><h2 class="h-panel" id="noti-h" tabindex="-1"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 003.4 0"/></svg>알림·협의 소식</h2>
            <div class="btn-row"><button type="button" class="btn btn-tertiary btn-sm" id="noti-read">모두 읽음</button><button type="button" class="dlg-x" id="noti-x" aria-label="알림 닫기" style="position:static"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>
          <ul id="noti-list"></ul>
          
        </section>
      </div>
      <div class="fontsz" role="group" aria-label="글자 크기">
        <button type="button" class="tbtn" id="fs-down" aria-label="글자 작게"><span aria-hidden="true" style="font-size:1.4rem;font-weight:700">가</span></button>
        <button type="button" class="tbtn" id="fs-up" aria-label="글자 크게"><span aria-hidden="true" style="font-size:2.1rem;font-weight:700">가</span></button>
      </div>
    </div>
  </div>
